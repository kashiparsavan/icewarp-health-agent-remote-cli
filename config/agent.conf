###############################################################################
#
# Agent Configuration
#
###############################################################################

AGENT_VERSION="0.8.0"

# IceWarp checklist edition referenced by both PDF reports.
CHECKLIST_VERSION="1.14"

MONITOR_URL=""

SEND_DATA=0

ICEWARP_HOME="/opt/icewarp"

OUTPUT_JSON="${PROJECT_ROOT}/output/health.json"

# Versioned envelope for monitoring/mobile consumers (docs/schema/health.v2.schema.json).
OUTPUT_JSON_V2="${PROJECT_ROOT}/output/health.v2.json"

# Per-call timeout (seconds) used for every tool.sh call and OS-command
# fallback inside iw_get(). Keeps a hung or locked service from stalling
# the whole agent run.
TOOL_TIMEOUT=5
STARTTLS_TIMEOUT=15

# Free text identifier for "Company name" in the checklist's General
# Information section. Not derived from IceWarp itself. Set per server.
COMPANY_NAME=""